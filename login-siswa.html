<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Kelas | Saku pintar</title>
    <link rel="stylesheet" href="shared/css/global.css">
    <style>
        html, body {
            overscroll-behavior: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #85C1E9;
            font-family: var(--font-student);
            margin: 0;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('shared/assets/bg-pantai.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.85); /* Agak transparan agar nyatu */
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 4px solid rgba(255, 255, 255, 0.6);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .login-card h1 {
            color: #10c2e2;
            margin-bottom: 25px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #0b849b;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-dark);
            font-size: 1.2rem;
        }
        .form-control {
            width: 100%;
            padding: 15px;
            border: 3px solid #E0E0E0;
            border-radius: 15px;
            font-size: 1.1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-control:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        .btn-login {
            background-color: var(--accent-color);
            color: var(--text-dark);
            font-size: 1.4rem;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 6px 0 #F39C12;
            width: 100%;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.1s;
            margin-top: 10px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn-login:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #F39C12;
        }
        .btn-back {
            display: block;
            margin-top: 25px;
            color: #7F8C8D;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        /* Penyesuaian Responsif untuk Mobile */
        @media (max-width: 768px) {
            @keyframes floatMobileDecor {
                0% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
                100% { transform: translateY(0); }
            }
            body::after {
                content: "";
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 15vh;
                background-image: url('shared/assets/overlay-pantai.png');
                background-size: 100% auto;
                background-position: bottom center;
                background-repeat: no-repeat;
                z-index: 1;
                pointer-events: none;
                animation: floatMobileDecor 4s ease-in-out infinite;
            }
            .login-card {
                position: relative;
                z-index: 2;
                padding: 30px 20px;
            }
            .login-card h1 {
                font-size: 2rem;
            }
            .btn-login {
                font-size: 1.1rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body ontouchstart="">
    <div class="login-card">
        <h1>Masuk Kelas</h1>
        <form id="loginSiswaForm">
            <div class="form-group">
                <label for="namaSiswa">Nama Panggilan:</label>
                <input type="text" id="namaSiswa" class="form-control" placeholder="Contoh: Budi" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="kelasSiswa">Kelas:</label>
                <input type="text" id="kelasSiswa" class="form-control" placeholder="Contoh: 3A" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">Mulai Bermain!</button>
        </form>
        <a href="index.html" class="btn-back">Kembali ke Portal</a>
    </div>

    <!-- Script Utama (tanpa utils dulu agar tidak kena redirect global) -->
    <script>
        document.getElementById('loginSiswaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nama = document.getElementById('namaSiswa').value.trim();
            const kelas = document.getElementById('kelasSiswa').value.trim();
            
            if(nama && kelas) {
                // Mainkan suara sukses jika ada
                const sfxSave = new Audio('klik semua.mp3');
                sfxSave.play().catch(err=>{});

                // Simpan ke Session Storage
                sessionStorage.setItem('siswaAuth', JSON.stringify({ nama, kelas }));
                
                // Pindah ke dashboard siswa
                setTimeout(() => {
                    window.location.href = 'student/index.html';
                }, 50);
            }
        });
    </script>
</body>
</html>
